cases:
  # ---- 공정 품질검사
  - category: inspection
    area: quality
    year: 2022–2025
    partner: Hyundai Steel, KEIT
    title: Automatic Classification of Special-Steel Surface Defects
    title_ko: 특수강 표면결함 자동 분류
    image: /assets/images/cases/steel-mflt.jpg
    featured: true
    text: Magnetic flux leakage (MFLT) NDT signals from steel bars; semi-supervised AI model detecting and classifying 7 defect types.
    results:
      - "Over 99% accuracy on 7 defect classes"
      - "Deployed at the Pohang plant (2024)"
      - "1 SCIE paper, 2 conference papers"
  - category: inspection
    area: quality
    year: 2023–2025
    partner: Hyundai Steel
    title: Tip-Crack Defect Detection for Large H-Beams
    title_ko: 대형 H-beam 팁터짐 불량 검출
    image: /assets/images/cases/hbeam-tipcrack.jpg
    featured: false
    text: Processing of continuous 3D scan data to detect tip-crack defects on large H-beams.
    results:
      - "100% detection rate"
      - "Field validation started (2025–)"
  - category: inspection
    area: quality
    year: 2025
    partner: Hyundai Steel
    title: Vision Recognition of Marking Codes on Rolling-Mill Feedstock
    title_ko: 대형압연 장입 소재 마킹 비전 인식 시스템
    image: /assets/images/cases/marking-ocr.jpg
    featured: true
    text: Marking-code recognition for steel materials, fused with process information.
    results:
      - "Over 98% accuracy, including low-quality markings"
      - "Installed on site"

  # ---- 품질 예측 및 최적화
  - category: prediction
    area: quality
    year: 2023
    partner: EcoPro BM
    title: Discharge-Capacity Prediction for Battery Cathode Material
    title_ko: 이차전지 양극재 방전용량 품질 예측
    image: /assets/images/cases/battery-capacity.jpg
    featured: true
    text: Identified the process variables that drive quality and built an AI model that predicts discharge capacity in real time from process data. Lab measurement normally takes more than 6 days.
    results:
      - "Prediction error of about ±0.57 mAh/g"
  - category: prediction
    area: quality
    year: 2023–2025
    partner: Hyundai Steel
    title: Weight Prediction and Cut-Length Optimization of Semi-Finished Steel
    title_ko: 철강 반제품 중량 예측 및 절단길이 최적화
    image: /assets/images/cases/slab-weight.jpg
    featured: false
    text: Predicts bulging and unit weight of cast semi-finished products and gives cut-length optimization guidance.
    results:
      - "Error improved by 18 percentage points over the current method"
      - "2 domestic conference papers"
  - category: prediction
    area: quality
    year: 2021–2023
    partner: Hyundai Steel
    title: Quality Prediction and Tempcore Cooling Optimization for Special Steel
    title_ko: 특수강 품질 예측 및 템프코어 냉각 최적화
    image: /assets/images/cases/tempcore-rl.jpg
    featured: false
    text: AI model predicting rebar yield strength, a multiphysics digital-twin model, and reinforcement-learning optimization of cooling variables.
    results:
      - "Better yield-strength quality and more efficient cooling-water use"
      - "1 SCIE paper, 2 conference papers"

  # ---- 설비 이상탐지 및 고장진단
  - category: diagnosis
    area: diagnosis
    year: 2023–2024
    partner: Wind Energy HRD Program
    title: Bearing Fault Detection for Rotating Machinery
    title_ko: 회전체 설비 베어링 고장탐지
    image: /assets/images/cases/bearing-fault.jpg
    featured: false
    text: Time–frequency multi-domain model that uses bearing physics, with attention-based condition monitoring that is robust to noise.
    results:
      - "99% detection accuracy (CWRU dataset)"
      - "2 SCIE papers"
  - category: diagnosis
    area: diagnosis
    year: 2026
    partner: Glocal University Program
    title: Fault Diagnosis Using Multi-Relational Process Graphs
    title_ko: 산업공정 다중관계 기반 고장진단
    image: /assets/images/cases/tep-graph.jpg
    featured: true
    text: Graph model of the many relations between pieces of equipment, combining data-driven and process-knowledge relations.
    results:
      - "State-of-the-art 96.8% on the TEP benchmark"
      - "1 SCIE paper in preparation"
  - category: diagnosis
    area: diagnosis
    year: 2026
    partner: Glocal University Program
    title: Process-Aware Equipment Anomaly Detection
    title_ko: 공정정보 기반 설비 이상탐지
    image: /assets/images/cases/swat-anomaly.jpg
    featured: false
    text: Graph anomaly-detection model built from the equipment layout. It encodes the sensor–equipment hierarchy and process flow, and detects when the process becomes abnormal by learning from normal operation.
    results:
      - "State of the art on the SWaT and WADI benchmarks"
      - "1 SCIE paper in preparation"

