---
layout: default
---
<section class="page-hero">
  <div class="container">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-sub">{{ page.subtitle }}</p>{% endif %}
  </div>
</section>
<div class="container page-body{% if page.wide %} wide{% endif %}">
  {{ content }}
</div>
