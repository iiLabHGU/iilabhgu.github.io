{% assign lab = site.lab %}
<footer class="site-footer">
  <div class="container footer-grid">
    <div>
      <p class="footer-title">{{ site.title }}</p>
      <p class="footer-muted">{{ site.title_ko }}<br>{{ lab.affiliation }}</p>
    </div>
    <div>
      <p class="footer-label">Location</p>
      <p class="footer-muted">{{ lab.room }}, {{ lab.address }}</p>
    </div>
    <div>
      <p class="footer-label">Contact</p>
      <p class="footer-muted">
        <a href="mailto:{{ lab.email }}">{{ lab.email }}</a><br>
        {{ lab.phone }}
      </p>
      <p class="footer-links">
        <a href="{{ lab.links.google_scholar }}">Scholar</a>
        <a href="{{ lab.links.orcid }}">ORCID</a>
        <a href="{{ lab.links.youtube }}">YouTube</a>
        <a href="{{ lab.links.github }}">GitHub</a>
      </p>
    </div>
  </div>
  <div class="container footer-bottom">
    © {{ site.time | date: '%Y' }} {{ site.title }}, Handong Global University
  </div>
</footer>
