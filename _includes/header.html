<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand-logo" src="{{ '/assets/images/logo.png' | relative_url }}" alt="{{ site.title_ko }} · {{ site.title }}" width="207" height="36">
    </a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="site-nav">
      <span></span><span></span><span></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      {% for item in site.data.navigation %}
        {% assign active = false %}
        {% if page.url == item.url %}{% assign active = true %}{% endif %}
        {% if item.url != '/' and page.url contains item.url %}{% assign active = true %}{% endif %}
        <a href="{{ item.url | relative_url }}"{% if active %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
