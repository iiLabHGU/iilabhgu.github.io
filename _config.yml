# Build settings (GitHub Pages compatible)
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
highlighter: rouge
permalink: pretty
timezone: Asia/Seoul

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: "research"
    values:
      layout: research

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - "*.pptx"
